<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Mind — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-login">
  <main class="phone-frame login-screen">
    <h1 class="brand-title">Save Mind</h1>

    <div class="illustration illustration--login" aria-hidden="true">
      <!-- Coloca tu imagen en: img/login-bot.png -->
      <img
        src="img/login-bot.png"
        alt="SaveBot frente a una laptop"
        class="illustration__img"
        width="220"
        height="220"
      >
      <div class="illustration__placeholder">
        <span>img/login-bot.png</span>
      </div>
    </div>

    <form id="login-form" class="login-form" novalidate>
      <label class="field">
        <span class="field__label">EMAIL</span>
        <input
          type="text"
          id="email"
          name="email"
          class="field__input"
          placeholder="aperez20@mail.com"
          autocomplete="email"
        >
      </label>

      <label class="field">
        <span class="field__label">CONTRASEÑA</span>
        <input
          type="password"
          id="password"
          name="password"
          class="field__input"
          placeholder="••••••••••••"
          autocomplete="current-password"
        >
      </label>

      <label class="remember">
        <input type="checkbox" id="remember" name="remember" checked>
        <span class="remember__box" aria-hidden="true"></span>
        <span class="remember__text">Recordar mis datos</span>
      </label>

      <p id="login-error" class="form-error" hidden>Ingresa un email y contraseña válidos.</p>

      <button type="submit" class="btn btn--login">Ingresar</button>
    </form>

    <a href="#" class="forgot-link" id="forgot-password">Olvidé mi contraseña</a>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
